cursor {
    no_hardware_cursors = true
}

general {
    border_size = 2
    gaps_in = 5
    gaps_out = 10

    col.active_border = rgba(8aadf4ff) rgba(ca9ee6ff) 45deg
    col.inactive_border = rgba(2e3440ff)

    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 3.0

    dim_inactive = true
    dim_strength = 0.1

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        noise = 0.01
        contrast = 1.05
        brightness = 0.98
        xray = false
    }

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(00000088)
    }
}

animations {
    enabled = true

    # Curves
    bezier = easeOut, 0.16, 1, 0.3, 1
    bezier = smooth, 0.25, 0.46, 0.45, 0.94

    # Window animations
    animation = windows, 1, 6, easeOut, slide
    animation = windowsIn, 1, 6, easeOut, slide
    animation = windowsOut, 1, 5, smooth, slide

    # Border animation (subtle, clean)
    animation = border, 1, 8, easeOut

    # Workspace transitions
    animation = workspaces, 1, 6, easeOut, slidefade
}

